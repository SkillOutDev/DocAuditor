services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docauditor}
      POSTGRES_USER: ${POSTGRES_USER:-docauditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docauditor} -d ${POSTGRES_DB:-docauditor}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

